name: Sync Gamepadla latency

on:
  schedule:
    - cron: "17 3 * * *"   # раз в сутки, 03:17 UTC
  workflow_dispatch:        # ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: sync-gamepadla
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse gamepadla.com
        run: node scripts/sync-gamepadla.js

      - name: Commit changes
        run: |
          if git diff --quiet -- gamepadla-data.json; then
            echo "gamepadla-data.json не изменился"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamepadla-data.json
          git commit -m "chore: sync gamepadla latency data"
          git push
